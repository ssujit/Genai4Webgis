<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GENIA - Geospatial Natural-language Interaction Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!--
    External UI/GIS dependencies
    - Leaflet: map rendering + interaction
    - Leaflet.markercluster: clustering many point features for performance
    Notes:
    - These are loaded from CDN for simplicity during thesis demo.
    - Production deployments may prefer pinning versions locally.
  -->

  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />

  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    /* =========================================================================
      GENIA UI THEME VARIABLES
      - Default: dark theme
      - Light theme overrides below via :root[data-theme="light"]
      ========================================================================= */
    :root{
      --bg-dark:#111318;
      --bg-dark-2:#1a1f2b;
      --bg-dark-3:#1c1f27;
      --border-dark:#222736;
      --text-light:#eaeef6;
      --muted:#cfd8ea;
      --muted-2:#aaa;
      --brand:#2d6cdf;
      --panel-bg:#ffffff;
      --panel-border:#dddddd;
      --shadow:0 4px 16px rgba(0,0,0,.15);
    }

    html, body { height:100%; margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .leaflet-container { z-index:0; }

    /* =========================================================================
      LAYOUT: 3-column prototype layout
      - Left sidebar: layer/data management
      - Center map: Leaflet
      - Right sidebar: chat interface
      ========================================================================= */
    #sidebar{
      position:absolute; inset:0 auto 0 0; width:260px; z-index:1300;
      background:var(--bg-dark); color:var(--text-light);
      box-shadow:2px 0 14px rgba(0,0,0,.35); display:flex; flex-direction:column;
    }
    #map{ position:absolute; left:260px; top:0; right:320px; bottom:0; }

    /* =========================================================================
      CHAT BUBBLES
      - Uses white-space: pre-line so replies can contain line breaks from \n
      - Styles are tuned for good readability in demo recordings
      ========================================================================= */
    .chat-msg {
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.35;
      white-space: pre-line;
    }

    .chat-user {
      align-self: flex-end;
      background: var(--brand);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .chat-bot {
      align-self: flex-start;
      background: var(--bg-dark-2);
      color: var(--text-light);
      border: 1px solid var(--border-dark);
      border-bottom-left-radius: 2px;
    }
    .chat-text { white-space: pre-line; }

    /* Explainability + “Model thoughts” panels (collapsed by default via <details>) */
    .chat-explain,
    .chat-thoughts {
      margin-top: 6px;
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 12px;
    }

    .chat-thoughts summary,
    .chat-explain summary {
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      opacity: 0.9;
    }

    .thoughts-box{
      margin-top: 8px;
      display: grid;
      gap: 8px;
    }

    .thought-item{
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .thought-title{
      font-weight: 700;
      margin-bottom: 4px;
    }

    .thought-detail{
      opacity: 0.92;
      line-height: 1.35;
    }

    /* Explainability: tab-style switching between Text and JSON views */
    .explain-tabs{
      display:flex;
      gap:8px;
      margin-top:6px;
    }

    .explain-tab{
      border:1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: inherit;
      padding: 4px 8px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 12px;
    }

    .explain-tab.active{
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.22);
    }

    .explain-view{
      margin: 8px 0 0 0;
      max-height: 180px;
      overflow: auto;
      font-size: 11px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    /* =========================================================================
      ATTRIBUTE TABLE (bottom panel under map)
      - GIS-like inspection of properties
      - Supports sorting + searching + row highlight
      ========================================================================= */
    #attrPanel{
      position:absolute;
      left:260px; right:320px; bottom:0;
      height:260px;
      z-index:1350;
      background:var(--panel-bg);
      border-top:1px solid var(--panel-border);
      box-shadow:0 -6px 18px rgba(0,0,0,.18);
      display:flex;
      flex-direction:column;
    }
    #attrHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:8px 10px;
      border-bottom:1px solid var(--panel-border);
      font-size:14px;
      font-weight:600;
    }
    #attrClose{
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:16px;
    }

    /* Fullscreen / maximized table mode */
    #attrPanel.maximized {
      left: 0 !important;
      right: 0 !important;
      top: 0 !important;
      bottom: 0 !important;
      height: auto !important;
      z-index: 2000;
    }

    #attrBody{
      overflow:auto;
      padding:8px 10px;
    }
    #attrTable{
      width:100%;
      border-collapse:collapse;
      font-size:12px;
    }
    #attrTable th {
      cursor: pointer;
      user-select: none;
      position: relative;
      padding-right: 18px;
    }

    #attrTable thead th{
      position:sticky;
      top:0;
      background:var(--panel-bg);
      z-index:1;
    }
    #attrTable tr:hover{
      background:rgba(45,108,223,0.10);
      cursor:pointer;
    }
    #attrTable th, #attrTable td{
      border:1px solid #d0d0d0;
      padding:6px 8px;
      text-align:left;
      vertical-align:top;
      white-space:nowrap;
    }
    #attrTable thead th{
      background:#f3f4f6;
      z-index:2;
    }
    #attrTable tbody tr:nth-child(even){
      background:#fafafa;
    }

    #attrSearch{
      padding:4px 8px;
      font-size:12px;
      border:1px solid var(--panel-border);
      border-radius:6px;
      outline:none;
    }

    /* Selected row highlight (synced from map click) */
    #attrTable tr.active {
      background: rgba(45,108,223,0.25) !important;
      outline: 2px solid var(--brand);
    }

    /* =========================================================================
      CHAT LOG container (right panel content)
      ========================================================================= */
    #chat-log {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      background: var(--bg-dark);
      color: var(--text-light);
    }

    /* "Assistant is typing..." indicator */
    .typing {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 2px;
      font-style: italic;
      color: var(--muted-2);
    }

    /* =========================================================================
      SIDEBAR (left)
      ========================================================================= */
    .sb-header{ padding:16px 14px; border-bottom:1px solid var(--border-dark); }
    .sb-toolbar{ padding:12px 10px; display:flex; gap:8px; border-bottom:1px solid var(--border-dark); }
    .btn{
      border:0; cursor:pointer; border-radius:8px; padding:8px 10px;
    }
    .btn-primary{ background:var(--brand); color:#fff; }
    .btn-ghost{ background:var(--bg-dark-2); color:var(--muted); width:38px; }
    .menu{ display:none; margin:8px 10px 0 10px; background:var(--bg-dark-2);
      border:1px solid var(--border-dark); border-radius:10px; overflow:hidden; }
    .menu button{
      width:100%; text-align:left; padding:10px 12px; background:transparent;
      color:var(--text-light); border:0; cursor:pointer;
    }
    .menu .sep{ border-top:1px solid var(--border-dark); }
    .sb-title{ padding:12px 10px; font-size:13px; font-weight:600; opacity:.8; }
    #layerList{ padding:0 10px; overflow:auto; flex:1; }
    .sb-footer{ padding:10px; font-size:11px; opacity:.5; border-top:1px solid var(--border-dark); }

    /* Sidebar header with 3-dot menu */
    .sb-header{
      padding:16px 14px;
      border-bottom:1px solid var(--border-dark);
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      position:relative;
    }

    .sb-header-main{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .sb-app-name{
      font-weight:800;
      letter-spacing:.4px;
      font-size: 22px;
    }
    .sb-app-name::after{
      content: "";
      display: block;
      margin-top: 4px;
      width: 42px;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #2d6cdf, #0ea5e9);
    }

    /* 3-dot dropdown */
    .sb-menu-btn{
      background:transparent;
      border:0;
      font-size:20px;
      line-height:1;
      color:var(--text-light);
      cursor:pointer;
      padding:0 4px;
    }

    .sb-menu-btn:hover{
      color:var(--brand);
    }

    .sb-menu{
      position:absolute;
      top:44px;
      right:10px;
      background:var(--bg-dark-2);
      border:1px solid var(--border-dark);
      padding:6px 0;
      width:190px;
      border-radius:6px;
      box-shadow:0 4px 14px rgba(0,0,0,0.4);
      z-index:4000;
    }

    .sb-menu-hidden{ display:none; }

    .sb-menu hr{
      border:none;
      border-top:1px solid var(--border-dark);
      margin:4px 0;
    }

    .sb-menu-item{
      background:none;
      border:0;
      text-align:left;
      color:var(--text-light);
      padding:8px 14px;
      width:100%;
      cursor:pointer;
      font-size:14px;
    }

    .sb-menu-item:hover{ background:var(--bg-dark-3); }

    /* Layer list row */
    .layer-row{
      display:flex; align-items:center; gap:8px; padding:8px; margin-bottom:8px;
      background:#151926; border:1px solid var(--border-dark); border-radius:10px;
    }
    .layer-row .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .btn-mini{ padding:4px 8px; border-radius:8px; border:0; cursor:pointer; }
    .btn-mini.zoom{ background:var(--bg-dark-2); color:var(--muted); }
    .btn-mini.remove{ background:#7b1e1e; color:#fff; }

    /* =========================================================================
      MAP FLOATING CONTROLS (right of map, left of chat)
      ========================================================================= */
    #controls{
      position:absolute; right:16px; top:16px; z-index:1200;
      background:var(--panel-bg); border:1px solid var(--panel-border);
      border-radius:10px; padding:10px 12px; box-shadow:var(--shadow); font-size:14px;
    }

    #statusbar{
      position:absolute; left:16px; bottom:16px; z-index:1200;
      background:var(--panel-bg); border:1px solid var(--panel-border);
      border-radius:10px; padding:8px 12px; box-shadow:var(--shadow);
      display:flex; gap:10px; align-items:center; font-size:14px;
    }

    /* =========================================================================
      CHATBOX (right)
      ========================================================================= */
    #chatbox{
      position:absolute;
      top:0;
      bottom:0;
      right:0;
      width:320px;
      z-index:1300;
      background:var(--bg-dark);
      color:var(--text-light);
      border-left:1px solid var(--border-dark);
      box-shadow:-2px 0 14px rgba(0,0,0,.35);
      display:flex;
      flex-direction:column;
    }

    #chat-log{
      flex:1;
      overflow-y:auto;
      padding:12px;
      font-size:14px;
      background:var(--bg-dark);
      color:var(--text-light);
    }

    #chatbox .input{
      display:flex;
      border-top:1px solid var(--border-dark);
      background:var(--bg-dark-2);
    }

    #chat-input{
      flex:1;
      border:0;
      padding:8px 10px;
      outline:none;
      font-size:14px;
      background:var(--bg-dark-2);
      color:var(--text-light);
    }

    #chat-input::placeholder{ color:var(--muted-2); }

    #chat-send{
      border:0;
      background:var(--brand);
      color:#fff;
      padding:0 16px;
      border-radius:0;
    }

    /* =========================================================================
      WFS CONNECT MODAL
      ========================================================================= */
    #wfsModal{
      display:none; position:absolute; inset:0; z-index:1400;
      background:rgba(0,0,0,.55); align-items:center; justify-content:center;
      font-family:inherit;
    }
    .wfs-card{
      width:520px; background:var(--bg-dark-3); color:var(--text-light);
      border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.45); padding:24px;
    }
    .wfs-input{
      width:100%; padding:10px; border:1px solid #353945; border-radius:8px;
      background:#111318; color:var(--text-light);
    }
    .hint{ font-size:12px; opacity:.6; margin-top:8px; }
    .actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .btn-cancel{ background:#2a2e38; color:#ddd; }

    /* =========================================================================
      LIGHT THEME OVERRIDES
      ========================================================================= */
    :root[data-theme="light"]{
      --bg-dark:#ffffff; --bg-dark-2:#f5f7fb; --bg-dark-3:#ffffff;
      --border-dark:#e6e9f2; --text-light:#151926; --muted:#445; --muted-2:#667;
      --panel-bg:#ffffff; --panel-border:#e6e9f2;
    }

    /* Theme toggle button */
    .theme-toggle{
      position:absolute; right:330px; top:16px; z-index:1300;
      background:var(--panel-bg); border:1px solid var(--panel-border);
      border-radius:10px; padding:8px 10px; cursor:pointer; box-shadow:var(--shadow);
    }

    /* Two-point distance measure button (manual tool) */
    .floating-measure{
      position:absolute; right:330px; top:110px; z-index:1000;
      background:#1f2937; color:#fff; border:none; border-radius:8px;
      padding:8px 10px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.2);
    }
    .floating-measure.active{ background:#0ea5e9; }

    /* Basemap trigger + basemap menu (quick base layer switching) */
    .fab{
      position:absolute; right:330px; top:60px; z-index:1200;
      border:1px solid var(--panel-border); background:var(--panel-bg); color:#111;
      border-radius:10px; padding:8px 10px; cursor:pointer; box-shadow:var(--shadow);
    }
    .bm-menu{
      position:absolute; right:340px; top:100px; z-index:1200;
      background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:12px;
      padding:10px; display:grid; gap:8px; min-width:160px; box-shadow:var(--shadow);
    }
    .bm-opt{
      text-align:left; padding:10px 12px; background:#f5f7fb; color:#151926;
      border:1px solid var(--panel-border); border-radius:8px; cursor:pointer;
    }
    .bm-opt:hover, .bm-opt.active{ outline:2px solid var(--brand); }

    /* Loader overlay (used while fetching WFS / parking data) */
    #loader{
      position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:1500;
      background:rgba(0,0,0,.25);
    }
    .spinner{
      width:48px; height:48px; border:4px solid #ddd; border-top-color:var(--brand);
      border-radius:50%; animation:spin 0.9s linear infinite; background:#fff;
      box-shadow:var(--shadow);
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* Popup styling polish */
    .leaflet-popup-content{ margin:8px 10px !important; line-height:1.35; }
    .popup-card{ font-size:13px; }
    .popup-card b{ font-size:14px; }
    .popup-meta{ opacity:.75; margin-top:6px; }

    /* Chatbox visual polish */
    #chatbox{ border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.2); background:var(--panel-bg); border:1px solid var(--panel-border); }
  </style>
</head>

<body>
  <!-- =========================================================================
    LEFT SIDEBAR
    - Branding + quick menu (reset/clear/about)
    - Add data controls (WFS)
    - Layer registry list (populated dynamically by parking.js)
  ========================================================================= -->
  <aside id="sidebar">
    <div class="sb-header">
      <div class="sb-title">
        <div class="sb-app-name">GENIA</div>
      </div>

      <button id="sbMenuBtn" class="sb-menu-btn" title="More options">⋮</button>

      <div id="sbMenu" class="sb-menu sb-menu-hidden">
        <button class="sb-menu-item" data-action="reset">Reset map view</button>
        <button class="sb-menu-item" data-action="clearLayers">Clear all layers</button>
        <button class="sb-menu-item" data-action="clearChat">Clear chat</button>
        <hr />
        <button class="sb-menu-item" data-action="about">About this app</button>
      </div>
    </div>

    <div class="sb-toolbar">
      <button id="btnAddData" class="btn btn-primary">+ Add data</button>
      <button id="btnCollapse" class="btn btn-ghost" title="Collapse">⟨</button>
    </div>

    <!-- Add Data dropdown (currently WFS only; upload remains supported by hidden file input) -->
    <div id="addMenu" class="menu">
      <button id="menuWfs" class="sep">Add remote service (WFS)</button>
    </div>

    <!-- Layer list (filled by JS) -->
    <div class="sb-title">Layers</div>
    <div id="layerList"></div>

    <div class="sb-footer">© Your thesis app</div>
  </aside>

  <!-- =========================================================================
    WFS MODAL
    - User pastes a full WFS GetFeature URL
    - parking.js fetches + adds as a Leaflet layer
    - This can become the active datasource for chat actions
  ========================================================================= -->
  <div id="wfsModal">
    <div class="wfs-card">
      <div style="font-weight:600; font-size:17px; margin-bottom:6px;">Connect to WFS</div>
      <div style="font-size:13px; opacity:.7; margin-bottom:18px;">
        Connect to a Web Feature Service (WFS) endpoint to load vector data from a remote server.
      </div>

      <label style="display:block; font-size:13px; margin-bottom:4px;">Layer Name</label>
      <input id="wfsLayerName" type="text" class="wfs-input" placeholder="Enter a name for this layer" style="margin-bottom:14px;">

      <label style="display:block; font-size:13px; margin-bottom:4px;">WFS Service URL</label>
      <input id="wfsFullUrl" type="text" class="wfs-input"
             placeholder="https://example.com/geoserver/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=workspace:layer&outputFormat=application/json">

      <div class="hint">
        Paste a full WFS GetFeature URL with required parameters:
        <code>service=WFS</code> • <code>request=GetFeature</code> • <code>version</code> • <code>typeName</code> • <code>outputFormat=application/json</code>
      </div>

      <div id="wfsStatus" style="margin-top:10px; font-size:12px; color:var(--muted-2);"></div>

      <div class="actions">
        <button id="wfsCancel" class="btn btn-cancel">Cancel</button>
        <button id="wfsConnect" class="btn btn-primary">Connect to WFS</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for optional local GeoJSON upload (wired in parking.js) -->
  <input id="fileInput" type="file"
         accept=".geojson,.json,application/geo+json,application/json" style="display:none;">

  <!-- Center map canvas -->
  <div id="map"></div>

  <!-- Theme toggle button (dark/light) -->
  <button id="theme-toggle" class="theme-toggle">☀️/🌙</button>

  <!-- Basemap picker -->
  <button id="bm-trigger" class="fab" title="Basemaps">🌐</button>
  <div id="bm-menu" class="bm-menu" style="display:none;">
    <button class="bm-opt" data-base="osm">Basic (OSM)</button>
    <button class="bm-opt" data-base="carto">DataViz (CARTO)</button>
    <button class="bm-opt" data-base="sat">Satellite</button>
  </div>

  <!-- Attribute table panel (hidden by default; shown when requested) -->
  <div id="attrPanel" style="display:none;">
    <div id="attrHeader">
      <div id="attrTitle">Attribute table</div>
      <input id="attrSearch" type="text" placeholder="Search…">
      <button id="attrMax" title="Maximize">⬜</button>
      <button id="attrClose" title="Close">✕</button>
    </div>
    <div id="attrBody">
      <table id="attrTable"></table>
    </div>
  </div>

  <!-- =========================================================================
    RIGHT CHAT PANEL
    - Displays chat history + explainability panels
    - Input sends messages to /chat (Flask backend)
  ========================================================================= -->
  <div id="chatbox">
    <div id="chat-log"></div>
    <div class="input">
      <input id="chat-input" type="text" placeholder="Ask here" />
      <button id="chat-send">Send</button>
    </div>
  </div>

  <!-- Manual two-point measurement tool (map click-based) -->
  <button id="measureBtn" class="floating-measure" title="Measure distance">📏</button>

  <!-- =========================================================================
    JavaScript dependencies
    - Leaflet core
    - MarkerCluster plugin
    - parking.js: the main application logic (deterministic executor)
  ========================================================================= -->

  <!-- Leaflet Core -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Main App Logic -->
  <script src="/static/script.js?v=2"></script>

</body>
</html>
